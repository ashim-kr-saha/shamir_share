name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable]
        feature-set:
          - name: default
            flags: ""
          - name: all-features
            flags: "--all-features"
          - name: no-default-features
            flags: "--no-default-features"
          - name: std-only
            flags: "--no-default-features --features std"
          - name: zeroize-only
            flags: "--no-default-features --features std,zeroize"
          - name: streaming-only
            flags: "--no-default-features --features std,streaming"
          - name: hsss-only
            flags: "--no-default-features --features std,hsss"
          - name: refresh-only
            flags: "--no-default-features --features std,refresh"
          - name: parallel-only
            flags: "--no-default-features --features std,parallel"
          - name: compress-only
            flags: "--no-default-features --features std,compress"
          - name: serde-only
            flags: "--no-default-features --features std,serde"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7

      - name: Run tests (${{ matrix.feature-set.name }})
        run: cargo test ${{ matrix.feature-set.flags }}

  no-std-check:
    name: No-Std (Wasm32) Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain with wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Check wasm32 compilation without default features
        run: cargo check --target wasm32-unknown-unknown --no-default-features

      - name: Check wasm32 with hsss and refresh
        run: cargo check --target wasm32-unknown-unknown --no-default-features --features "hsss,refresh"

      - name: Check wasm32 with serde
        run: cargo check --target wasm32-unknown-unknown --no-default-features --features "serde"

  doc-tests:
    name: Documentation Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7

      - name: Run doc tests
        run: cargo test --doc --all-features

  lints:
    name: Lints and Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9be95417288c0e1099b1eeec3 # v2.7.7

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Verify Fuzz Targets Compile
        run: cargo check --manifest-path fuzz/Cargo.toml

      - name: Verify Package Dry-Run
        run: cargo package --allow-dirty
