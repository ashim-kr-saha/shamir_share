[package]
name = "shamir_share"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["Ashim Kumar Saha"]
description = "A secure and efficient Rust library for Shamir's Secret Sharing"
license = "MIT"
repository = "https://github.com/ashim-kr-saha/shamir_share"
keywords = ["cryptography", "secret-sharing", "security", "shamir"]
categories = ["cryptography", "algorithms"]
readme = "README.md"
exclude = [
    ".DS_Store",
    ".docs",
    ".github",
    "fuzz",
    "justfile",
    "run_streaming_benchmarks.sh",
]


[dependencies]
rand = "0.10.3"
rand_chacha = "0.10.0"
thiserror = "2.0.21"
rayon = "1.12.0"
sha2 = "0.11.1"
subtle = "2.6"
zstd = { version = "0.14.3", optional = true }
zeroize = { version = "1.9.1", features = ["zeroize_derive"], optional = true }

[features]
default = ["zeroize", "compress"]
compress = ["zstd"]

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.27.0"

[[bench]]
name = "in_memory_benchmarks"
harness = false

[[bench]]
name = "streaming_benchmarks"
harness = false

[[bench]]
name = "hsss_benchmarks"
harness = false

[[bench]]
name = "benchmark"
harness = false

[[bench]]
name = "refresh_benchmarks"
harness = false
