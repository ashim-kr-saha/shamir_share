[package]
name = "shamir_share"
version = "0.2.1"
edition = "2024"
authors = ["Ashim Kumar Saha"]
description = "A secure and efficient Rust library for Shamir's Secret Sharing"
license = "MIT"
repository = "https://github.com/ashim-kr-saha/shamir_share"
keywords = ["cryptography", "secret-sharing", "security", "shamir"]
categories = ["cryptography", "algorithms"]

[dependencies]
rand = "0.10.3"
rand_chacha = "0.10.0"
rand_core = "0.10.1"
thiserror = "2.0.21"
rayon = "1.12.0"
bytes = "1.12.1"
serde = { version = "1.0.229", features = ["derive"] }
zstd = { version = "0.14.3", optional = true }
anyhow = "1.0.104"
once_cell = "1.21.4"
sha2 = "0.11.1"
zeroize = { version = "1.9.1", features = ["zeroize_derive"], optional = true }

[features]
default = ["zeroize", "compress"]
compress = ["zstd"]

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-test = "0.4.6"

[[bench]]
name = "in_memory_benchmarks"
harness = false

[[bench]]
name = "streaming_benchmarks"
harness = false

[[bench]]
name = "hsss_benchmarks"
harness = false

[[bench]]
name = "benchmark"
harness = false
