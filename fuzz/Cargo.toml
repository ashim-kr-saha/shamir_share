[package]
name = "shamir_share-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"
shamir_share = { path = "..", features = ["compress", "serde", "parallel"] }

[[bin]]
name = "fuzz_reconstruct"
path = "fuzz_targets/fuzz_reconstruct.rs"
test = false
doc = false

[[bin]]
name = "fuzz_share_from_bytes"
path = "fuzz_targets/fuzz_share_from_bytes.rs"
test = false
doc = false

[[bin]]
name = "fuzz_reconstruct_stream"
path = "fuzz_targets/fuzz_reconstruct_stream.rs"
test = false
doc = false

[[bin]]
name = "fuzz_hsss"
path = "fuzz_targets/fuzz_hsss.rs"
test = false
doc = false

[[bin]]
name = "fuzz_serde_share"
path = "fuzz_targets/fuzz_serde_share.rs"
test = false
doc = false

[[bin]]
name = "fuzz_refresh"
path = "fuzz_targets/fuzz_refresh.rs"
test = false
doc = false
